name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pyyaml

      - name: Run tests
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=. pytest -q -p no:cacheprovider

  typescript:
    name: TypeScript build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/setorra-ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/setorra-ai/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

